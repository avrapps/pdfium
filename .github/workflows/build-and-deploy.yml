name: Build PDFium & Deploy to falcon-pdfium-binaries

on:
  push:
    branches:
      - default
    paths:
      - 'core/**'
      - 'fpdfsdk/**'
      - 'fxjs/**'
      - 'constants/**'
      - 'public/**'
      - 'third_party/**'
      - 'BUILD.gn'
      - '*.gni'
      - 'patches/embedpdf-runtime/**'
      - 'scripts/embedpdf-runtime/**'
      - '.github/workflows/build-and-deploy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (default: default branch)'
        required: false
        default: default

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: arm64-v8a }
          - { target: armeabi-v7a }
          - { target: x86 }
          - { target: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Install Linux base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld curl g++ pkg-config tar

      - name: Build target
        run: scripts/embedpdf-runtime/build-target.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-android-${{ matrix.target }}
          path: out/embedpdf-runtime/${{ matrix.target }}/libembedpdf.so

  build-ios:
    name: Build iOS (${{ matrix.target }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: ios-arm64 }
          - { target: ios-simulator-arm64 }
          - { target: ios-simulator-x64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        run: sudo xcode-select -s "/Applications/Xcode_26.0.app"

      - name: Install depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Build target
        run: scripts/embedpdf-runtime/build-target.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-${{ matrix.target }}
          path: out/embedpdf-runtime/${{ matrix.target }}/obj/libembedpdf.a

  build-desktop:
    name: Build Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15, file: libembedpdf.dylib }
          - { target: darwin-x64, runner: macos-15, file: libembedpdf.dylib }
          - { target: linux-x64, runner: ubuntu-24.04, file: libembedpdf.so }
          - { target: linux-arm64, runner: ubuntu-24.04, file: libembedpdf.so }
          - { target: win32-x64, runner: windows-2022, file: embedpdf.dll }
          - { target: win32-arm64, runner: windows-2022, file: embedpdf.dll }
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Select Xcode
        if: runner.os == 'macOS'
        shell: bash
        run: sudo xcode-select -s "/Applications/Xcode_26.0.app"

      - name: Install depot_tools
        shell: bash
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      - name: Install Linux base deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang lld curl g++ pkg-config tar

      - name: Find MSVC rc.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $rcPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\rc.exe" -Recurse | Sort-Object -Descending | Select-Object -First 1 | Split-Path -Parent
          if (-not $rcPath) { throw "rc.exe not found" }
          $rcPath | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build target
        shell: bash
        run: scripts/embedpdf-runtime/build-target.sh "${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfium-${{ matrix.target }}
          path: out/embedpdf-runtime/${{ matrix.target }}/${{ matrix.file }}

  deploy:
    name: Deploy binaries to falcon-pdfium-binaries
    needs: [build-android, build-ios, build-desktop]
    runs-on: macos-15
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout falcon-pdfium-binaries
        uses: actions/checkout@v4
        with:
          repository: avrapps/falcon-pdfium-binaries
          token: ${{ secrets.PDFIUM_BINARIES_PAT }}
          path: falcon-pdfium-binaries

      - name: Copy Android binaries
        run: |
          cp artifacts/pdfium-android-arm64-v8a/libembedpdf.so falcon-pdfium-binaries/binaries/android/arm64-v8a/libfalconpdf.so
          cp artifacts/pdfium-android-armeabi-v7a/libembedpdf.so falcon-pdfium-binaries/binaries/android/armeabi-v7a/libfalconpdf.so
          cp artifacts/pdfium-android-x86/libembedpdf.so falcon-pdfium-binaries/binaries/android/x86/libfalconpdf.so
          cp artifacts/pdfium-android-x86_64/libembedpdf.so falcon-pdfium-binaries/binaries/android/x86_64/libfalconpdf.so

      - name: Copy Desktop binaries
        run: |
          cp artifacts/pdfium-darwin-arm64/libembedpdf.dylib falcon-pdfium-binaries/binaries/macosArm64/libfalconpdf.dylib
          cp artifacts/pdfium-darwin-x64/libembedpdf.dylib falcon-pdfium-binaries/binaries/macosX64/libfalconpdf.dylib
          cp artifacts/pdfium-linux-x64/libembedpdf.so falcon-pdfium-binaries/binaries/linuxX64/libfalconpdf.so
          cp artifacts/pdfium-linux-arm64/libembedpdf.so falcon-pdfium-binaries/binaries/linuxArm64/libfalconpdf.so
          cp artifacts/pdfium-win32-x64/embedpdf.dll falcon-pdfium-binaries/binaries/mingwX64/falconpdf.dll
          cp artifacts/pdfium-win32-arm64/embedpdf.dll falcon-pdfium-binaries/binaries/mingwArm64/falconpdf.dll

      - name: Build iOS xcframework
        run: |
          mkdir -p staging/ios-arm64 staging/ios-simulator

          cp artifacts/pdfium-ios-arm64/libembedpdf.a staging/ios-arm64/libfalconpdf.a

          # Combine simulator architectures with lipo
          lipo -create \
            artifacts/pdfium-ios-simulator-arm64/libembedpdf.a \
            artifacts/pdfium-ios-simulator-x64/libembedpdf.a \
            -output staging/ios-simulator/libfalconpdf.a

          # Remove existing xcframework and rebuild
          rm -rf falcon-pdfium-binaries/binaries/ios-framework/falconpdf.xcframework
          xcodebuild -create-xcframework \
            -library staging/ios-arm64/libfalconpdf.a \
            -library staging/ios-simulator/libfalconpdf.a \
            -output falcon-pdfium-binaries/binaries/ios-framework/falconpdf.xcframework

      - name: Commit and push
        working-directory: falcon-pdfium-binaries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
            git commit -m "chore: update pdfium binaries from avrapps/pdfium@${SHORT_SHA}

            Built from: https://github.com/avrapps/pdfium/actions/runs/${{ github.run_id }}"
            git push
          fi
