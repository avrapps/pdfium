name: Sync upstream pdfium

on:
  schedule:
    - cron: '0 6 * * 1' # Every Monday at 6am UTC
  workflow_dispatch: # Manual trigger from Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: default
          fetch-depth: 0
          # Use a PAT (not GITHUB_TOKEN) so the push below triggers the
          # build-and-deploy workflow. Pushes made with GITHUB_TOKEN do not
          # fire further workflow runs (GitHub loop protection).
          token: ${{ secrets.PDFIUM_BINARIES_PAT }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: git remote add upstream https://github.com/embedpdf/pdfium.git

      - name: Fetch upstream
        run: git fetch upstream

      - name: Check for new commits
        id: check
        run: |
          UPSTREAM_HEAD=$(git rev-parse upstream/embedpdf/main)
          if git merge-base --is-ancestor "$UPSTREAM_HEAD" HEAD; then
            echo "up_to_date=true" >> $GITHUB_OUTPUT
          else
            echo "up_to_date=false" >> $GITHUB_OUTPUT
          fi

      - name: Merge upstream into default
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          git merge upstream/embedpdf/main --no-edit || {
            echo "::error::Merge failed due to conflicts. Manual resolution required."
            git merge --abort
            exit 1
          }

      - name: Push updated default branch
        if: steps.check.outputs.up_to_date == 'false'
        run: git push origin default
